<!DOCTYPE html>
<html lang="en">

<head>
    <title>Need for Madness</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        body {
            margin: 0px;
            padding: 0px;
            overflow: hidden;
        }

        @font-face {
            font-family: junk;
            src: url(data/JunkDog.ttf);
        }

        @font-face {
            font-family: verd;
            src: url(data/verdana.ttf);
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.7.0/gl-matrix-min.js"></script>
    <script src="needmad.js"></script>
</head>

<body onload="init()" bgcolor="#15190D" link="#D3F2FF" alink="#D3F2FF" vlink="#D3F2FF" leftmargin="0" topmargin="0"
    margin="0" marginheight="0" marginwidth="0">

    <table id="loading" style="position: absolute; left: 0px; top: 0px; width: 100%; height: 100%">
        <tbody>
            <tr>
                <td valign="center" align="center">
                    <span style="font-family:Verdana, Arial; font-size:14px;">
                        <font color="#6DCA00"><b>Loading, please wait...</b></font>
                    </span>
                </td>
            </tr>
        </tbody>
    </table>

    <canvas id="canvas3D"
        style="position: absolute; left: 0px; top: 0px; padding-left: 0; padding-right: 0; margin-right: auto; margin-left: auto; display: block; width: 1280px; height: 720px;"
        width="1280" height="720"></canvas>
    <canvas id="canvas2D"
        style="position: absolute; left: 0px; top: 0px; padding-left: 0; padding-right: 0; margin-right: auto; margin-left: auto; display: block; width: 1280px; height: 720px;"
        width="1280" height="720"></canvas>


    <script>
        var canvas3D = document.querySelector('#canvas3D');
        var gl = (canvas3D.getContext('webgl') || canvas3D.getContext('experimental-webgl'));

        var canvas2D = document.querySelector('#canvas2D');
        canvas2D.addEventListener("mousedown", msdown, false);
        canvas2D.addEventListener('mousemove', msmove, false);
        canvas2D.addEventListener("mouseup", msup, false);
        canvas2D.addEventListener('mouseout', msup, false);
        canvas2D.addEventListener('touchmove', frmove, false);
        canvas2D.addEventListener('touchstart', frdown, false);
        canvas2D.addEventListener('touchend', frup, false);
        var rd = canvas2D.getContext('2d');


        var xm = [];
        var ym = [];
        var nms = 0;
        var mdown = false;
        var enter = 0;


        function msmove(evt) {
            var rect = canvas2D.getBoundingClientRect();
            xm[0] = (evt.clientX - rect.left);
            ym[0] = (evt.clientY - rect.top);
            nms = 1;
        }

        function msdown(evt) {
            var rect = canvas2D.getBoundingClientRect();
            xm[0] = (evt.clientX - rect.left);
            ym[0] = (evt.clientY - rect.top);
            nms = 1;
            mdown = true;
        }

        function msup(evt) {
            mdown = false;
            checknplay();
        }

        function frmove(evt) {
            evt.preventDefault();
            var rect = canvas2D.getBoundingClientRect();

            nms = 0;
            for (var i = 0; i < evt.touches.length; i++) {
                xm[nms] = (evt.touches[i].clientX - rect.left);
                ym[nms] = (evt.touches[i].clientY - rect.top);
                nms++;
            }

        }


        function frdown(evt) {
            evt.preventDefault();
            var rect = canvas2D.getBoundingClientRect();

            nms = 0;
            for (var i = 0; i < evt.touches.length; i++) {
                xm[nms] = (evt.touches[i].clientX - rect.left);
                ym[nms] = (evt.touches[i].clientY - rect.top);
                mdown = true;
                nms++;
            }


        }

        function frup(evt) {
            evt.preventDefault();
            var rect = canvas2D.getBoundingClientRect();

            nms = 0;
            for (var i = 0; i < evt.touches.length; i++) {
                xm[nms] = (evt.touches[i].clientX - rect.left);
                ym[nms] = (evt.touches[i].clientY - rect.top);
                nms++;
            }

            if (fase == 7) {
                if (nms == 0) {
                    mdown = false;
                    checknplay();
                }
            } else {
                mdown = false;
                checknplay();
            }
        }

        var pbr = 1;

        function Keydown(evt) {
            evt.preventDefault();

            var k = evt.keyCode;

            if (k == 38 || k == 87) {
                u[0].up = true;
            }
            if (k == 40 || k == 83) {
                u[0].down = true;
            }
            if (k == 37 || k == 65) {
                u[0].left = true;
            }
            if (k == 39 || k == 68) {
                u[0].right = true;
            }
            if (k == 32) {
                u[0].handb = true;
                if (fase != 7) {
                    if (!enter) {
                        enter = 1;
                    }
                }
            }
            if (k == 13 || k == 27) {
                if (!enter) {
                    enter = 1;
                }
            }
            if (k == 90) {
                lookback = -1;
            }
            if (k == 88) {
                lookback = 1;
            }
        }


        function Keyup(evt) {
            evt.preventDefault();

            var k = evt.keyCode;

            if (k == 38 || k == 87) {
                u[0].up = false;
            }
            if (k == 40 || k == 83) {
                u[0].down = false;
            }
            if (k == 37 || k == 65) {
                u[0].left = false;
            }
            if (k == 39 || k == 68) {
                u[0].right = false;
            }
            if (k == 32) {
                u[0].handb = false;
                if (fase != 7) {
                    if (enter) {
                        enter = 0;
                    }
                }
            }
            if (k == 13 || k == 27) {
                if (enter) {
                    enter = 0;
                }
            }
            if (k == 81) {
                if (u[0].arrace) {
                    u[0].arrace = false;
                } else {
                    u[0].arrace = true;
                }
            }
            if (k == 90 || k == 88) {
                lookback = 0;
            }
            if (k == 86) {
                if (fase == 7) {
                    camode++;
                    if (camode == 3) {
                        camode = 0;
                    }
                }
            }
            if (k == 78) {
                if (!mutegame) {
                    mutegame = true;
                    if (engstarted) {
                        engsource.loop = false;
                        engstarted = false;
                    }
                } else {
                    mutegame = false;
                }
            }
            if (k == 77) {
                if (!mutemusic) {
                    mutemusic = true;
                } else {
                    mutemusic = false;
                }
            }

        }

        function init() {
            saveInfo("unlocked", 17)
            saveInfo("rewlocked0", 0)
            saveInfo("rewlocked1", 0)
            saveInfo("rewlocked2", 0)
            saveInfo("rewlocked3", 0)

            gotGamepads();
            document.getElementById("loading").style.visibility = "hidden";
            gameloop();
        }

        function saveInfo(iname, ivalue) {
            localStorage.setItem(iname, ivalue)
        }

        function getInfo(iname) {
            var ivalue = localStorage.getItem(iname)

            if (ivalue == null) {
                return -1;
            }

            ivalue = parseInt(ivalue)
            if (Number.isNaN(ivalue)) {
                return -1;
            }

            return ivalue;
        }

        window.addEventListener("keydown", Keydown, false);
        window.addEventListener("keyup", Keyup, false);

        document.addEventListener("visibilitychange", function () {
            if (document.visibilityState == "visible") {
                mutemusic = omutemusic;
                mutegame = omutegame;
            } else {
                omutemusic = mutemusic;
                omutegame = mutegame;
                mutemusic = true;
                mutegame = true;
                if (engstarted) {
                    engsource.loop = false;
                    engstarted = false;
                }
            }
        });
    </script>
</body>

</html>
